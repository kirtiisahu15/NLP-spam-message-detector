<!DOCTYPE html>
<html>
<head>
<title>Spam_Detector</title>
<style>
    body {
        background: linear-gradient(to right , #80efdb , #91a1eb);
        text-align: center;
        font-family: Arial;
    }
    h1 {
        color: #333;
        margin-top: 15px;
        margin-bottom: 20px;
        border:3px solid #6f7ec1;
        border-radius: 10px;
        background-color: bisque ;
    }
    textarea {
        width: 400px;
        height: 120px;
        padding: 10px;
        border-radius: 10px;
        border: 3px solid #d1aeae;
        font-size: 16px;
    }
    button {
        margin-top: 1px;
        padding: 10px 45px;
        background-color: bisque;
        color: red;
        border:3px solid #6f7ec1;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background-color: #e89797;
    }
    .result-box {
    width: 300px;
    margin: 20px auto;
    padding: 15px;
    background-color: bisque;
    border: 2px solid #6f7ec1;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .result-box p {
    margin: 0;
    font-size: 18px;
    font-weight: bold;
    }

    .result-box h3 {
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
    color: green;
    }
</style>
</head>
<body>
    <h1>SPAM DETECTOR</h1>
    <form method="POST" action="/">
        <textarea name="message" rows="5" cols="40" placeholder="Type Your Message Here"></textarea>
        <br><br>
        <button type="submit">Predict</button>
    </form>
    <div class="result-box">
        <p>Result :</p>
        <h2>{{ result }}</h2>
    </div>
</body>
</html>
